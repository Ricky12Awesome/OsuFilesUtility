name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*-*'
      - 'v*.*.*'
  
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PROJECT_FILE: OsuFilesUtility.csproj
  EXE_NAME: OsuFilesUtility
  NEW_EXE_NAME: ofu

jobs:
  artifact:
    name: Artifact for ${{ matrix.job.os-name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - os: ubuntu-latest
            os-name: Linux x64
            rid: linux-x64
            ext:
            archive_ext: .tar.gz

          - os: windows-latest
            os-name: Windows x64
            rid: win-x64
            ext: .exe
            archive_ext: .zip

          - os: macos-latest
            os-name: MacOS x64
            rid: osx-x64
            ext:
            archive_ext: .tar.gz

          - os: macos-latest
            os-name: MacOS ARM
            rid: osx-arm64
            ext:
            archive_ext: .tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set Version
        #        if: startsWith(github.ref, 'refs/tags/v') # Ignore this job if I do manual build for testing
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else 
            echo "VERSION=0.0.0" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Build and Publish for ${{ matrix.job.rid }}
        shell: bash
        run: |
          dotnet publish ${{ env.PROJECT_FILE }} \
            -c Release \
            -r ${{ matrix.job.rid }} \
            -o build/${{ matrix.job.rid }} \
            -p:Version=${{ steps.get_version.outputs.VERSION }} \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --self-contained true

      - name: Rename Exe
        shell: bash
        run: mv build/${{ matrix.job.rid }}/${{ env.EXE_NAME }}${{ matrix.job.ext }} build/${{ matrix.job.rid }}/${{ env.NEW_EXE_NAME }}${{ matrix.job.ext }}

      - name: Create Windows archive
        if: ${{ startsWith(matrix.job.rid, 'win-') }}
        shell: pwsh
        run: |
          $archive = "build/${{ matrix.job.rid }}/${{ env.EXE_NAME }}-${{ matrix.job.rid }}${{ matrix.job.archive_ext }}"
          $executable = "build/${{ matrix.job.rid }}/${{ env.NEW_EXE_NAME }}${{ matrix.job.ext }}"
          Compress-Archive -LiteralPath $executable -DestinationPath $archive -Force

      - name: Create Unix archive
        if: ${{ !startsWith(matrix.job.rid, 'win-') }}
        shell: bash
        run: |
          archive="build/${{ matrix.job.rid }}/${{ env.EXE_NAME }}-${{ matrix.job.rid }}${{ matrix.job.archive_ext }}"
          tar -czf "$archive" \
            -C "build/${{ matrix.job.rid }}" \
            "${{ env.NEW_EXE_NAME }}${{ matrix.job.ext }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.job.rid }}
          path: build/${{ matrix.job.rid }}/${{ env.EXE_NAME }}-${{ matrix.job.rid }}${{ matrix.job.archive_ext }}

  create-release:
    runs-on: ubuntu-latest
    needs: artifact
    if: startsWith(github.ref, 'refs/tags/v') # Ignore this job if I do manual build for testing
    steps:
      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: artifacts/*
